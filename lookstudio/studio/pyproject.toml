[project]
name = "infinite-arch-photo-lab"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.8",
  "pydantic-settings>=2.4",
  "sqlalchemy>=2.0",
  "alembic>=1.13",
  "psycopg[binary]>=3.2",
  "python-multipart>=0.0.9",
  "httpx>=0.27",
  "websockets>=13",
  "pillow>=10",
  "numpy>=2",
  "scipy>=1.14",
  "orjson>=3.10",
  "structlog>=24"
]

[project.optional-dependencies]
imaging = ["rawpy>=0.21", "colour-science>=0.4.4"]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "ruff>=0.6"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
